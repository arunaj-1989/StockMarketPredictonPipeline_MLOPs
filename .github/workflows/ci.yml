name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - name: Install dependencies
        run: pip install -r requirements-serve.txt pytest==9.2.0 ruff==0.17.6
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker build -t nifty50-mlops:ci .
